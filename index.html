<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>서군혁 — 실감피지컬컴퓨팅</title>
<style>
:root{
  --bg:#0d0d0e; --ink:#f4f4f5; --muted:#a1a1aa; --dim:#6b6b73;
  --line:#242427; --hover:#1b1b1e; --ring:rgba(255,255,255,.08);
  --mono:ui-monospace,"SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Inter","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;padding:56px 24px}
.wrap{width:100%;max-width:440px}

/* profile */
.avatar{width:76px;height:76px;border-radius:50%;display:block;
  box-shadow:0 0 0 1px var(--ring),0 1px 3px rgba(0,0,0,.4)}
h1{margin:22px 0 0;font-size:25px;font-weight:600;letter-spacing:-.025em}
.role{margin:5px 0 0;color:var(--muted);font-size:14.5px}
.links{margin:14px 0 0;display:flex;gap:16px;font-size:13.5px}
.links a{color:var(--muted);text-decoration:none;transition:color .15s}
.links a:hover{color:var(--ink)}

hr{border:0;border-top:1px solid var(--line);margin:34px 0 22px}

/* list */
h2{margin:0 0 4px;font-family:var(--mono);font-size:11px;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
ul{list-style:none;margin:0;padding:0}
li a,li .row{display:flex;align-items:center;gap:14px;
  padding:13px 12px;margin:0 -12px;border-radius:9px;text-decoration:none;color:inherit;
  transition:background .15s}
li a:hover{background:var(--hover)}
.week{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.02em}
.title{flex:1;font-family:var(--mono);font-size:13.5px;letter-spacing:-.01em}
.arrow{flex:none;color:var(--dim);font-size:14px;transition:transform .18s,color .15s}
li a:hover .arrow{transform:translateX(3px);color:var(--muted)}
li .row .title{color:var(--dim)}
.dot{flex:none;width:5px;height:5px;border-radius:50%;background:var(--dim)}

footer{margin-top:36px;font-size:13px;color:var(--dim)}

@media(max-width:600px){body{padding:40px 20px}h1{font-size:22px}.title{font-size:12.5px}}
</style>
</head>
<body>
<div class="wrap">

  <img class="avatar" src="https://github.com/gunhyeok0803.png" alt="">
  <h1>서군혁</h1>
  <p class="role">실감피지컬컴퓨팅 · 내 방 디지털 트윈</p>
  <div class="links">
    <a href="https://github.com/gunhyeok0803">GitHub</a>
    <a href="https://github.com/gunhyeok0803/My_Place">저장소</a>
  </div>

  <hr>

  <h2>과제</h2>
  <ul>
    <li><a href="room-template.html">
      <span class="week">Week 02</span>
      <span class="title">room-template.html</span>
      <span class="arrow">→</span>
    </a></li>
    <li><a href="splat-twin.html">
      <span class="week">Week 03</span>
      <span class="title">splat-twin.html</span>
      <span class="arrow">→</span>
    </a></li>
    <!-- 새 주차는 위 형식으로 한 덩어리 추가 -->
    <li><div class="row">
      <span class="week">Week 04</span>
      <span class="title">chair.spz</span>
      <span class="dot"></span>
    </div></li>
  </ul>

  <footer>2026 · 실감피지컬컴퓨팅</footer>

</div>
</body>
</html>
